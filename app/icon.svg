<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!--
    The browser-tab mark.

    A static copy of components/marketing/brand-mark.tsx rather than an import,
    because Next serves this file as-is and it has no React around it. The paths
    are the three exported from that module; if the mark is redrawn, redraw it
    here too.

    No dish. It is a hairline at 48 units and nothing at all at sixteen pixels,
    which is the size this file actually gets used at — see the note in the
    component about the ring that had to be taken out for exactly this reason.

    The colour is written out rather than taken from currentColor: a favicon
    has no surrounding text to inherit from. It is the light theme's primary
    green, which stays legible on the near-white and near-black tab strips
    browsers use. Note that a double hyphen cannot appear in an XML comment, so
    the token name is spelled out rather than quoted.
  -->
  <path d="M24 41.5V30" stroke="#1c5b3e" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M24 31.5C18 33.5 10.5 29.5 6.5 18.5 15 18.5 22 23 24 31.5Z" fill="#1c5b3e" opacity="0.72"/>
  <path d="M24 31.5C30 33.5 37.5 29.5 41.5 18.5 33 18.5 26 23 24 31.5Z" fill="#1c5b3e" opacity="0.72"/>
  <path d="M24 4C30.5 11.5 32.5 22 24 32 15.5 22 17.5 11.5 24 4Z" fill="#1c5b3e"/>
</svg>
