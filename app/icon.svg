<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!--
    The browser-tab mark.

    A static copy of components/marketing/brand-mark.tsx rather than an import,
    because Next serves this file as-is and it has no React around it. The paths
    are the two exported from that module; if the mark is redrawn, redraw it
    here too.

    The colour is written out rather than taken from currentColor: a favicon
    has no surrounding text to inherit from. It is the light theme's primary
    green, which stays legible on the near-white and near-black tab strips
    browsers use. Note that a double hyphen cannot appear in an XML comment, so
    the token name is spelled out rather than quoted.
  -->
  <path d="M24 43.5V31" stroke="#1c5b3e" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M25 32C22.2 22.2 27.2 11 38 5 41.2 16.4 36 27.8 25 32Z" fill="#1c5b3e"/>
  <path d="M22.4 33.2C14.2 30.4 8.2 22 7.8 11.4 17 13.8 22.4 21.4 23.2 31.8Z" fill="#1c5b3e" opacity="0.68"/>
</svg>
