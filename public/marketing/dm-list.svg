<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Illustration standing in for a photograph of a farmer listing vegetables on the application">
  <rect width="400" height="300" fill="#eef4ea"/>

  <!-- The crate of produce, listed. -->
  <path d="M60 196h120v56H60z" fill="#d9c7a8"/>
  <path d="M60 196h120v10H60zM60 220h120v8H60z" fill="#c2ab88"/>
  <g fill="#3f8b45">
    <circle cx="88" cy="182" r="18"/><circle cx="120" cy="176" r="22"/><circle cx="154" cy="184" r="16"/>
  </g>
  <g fill="#2f6b34" opacity=".45">
    <circle cx="120" cy="170" r="6"/><circle cx="86" cy="178" r="4"/>
  </g>

  <!-- The handset, mid-listing: a heading and four filled rows. -->
  <rect x="220" y="56" width="118" height="196" rx="16" fill="#ffffff" stroke="#2f6b34" stroke-width="3"/>
  <rect x="238" y="80" width="62" height="10" rx="5" fill="#2f6b34"/>
  <g fill="#d9c7a8">
    <rect x="238" y="106" width="82" height="9" rx="4.5"/>
    <rect x="238" y="126" width="70" height="9" rx="4.5"/>
    <rect x="238" y="146" width="82" height="9" rx="4.5"/>
    <rect x="238" y="166" width="54" height="9" rx="4.5"/>
  </g>
  <rect x="238" y="196" width="82" height="26" rx="13" fill="#3f8b45"/>
</svg>
