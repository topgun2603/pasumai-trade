    <path d="M232 184l10 10 18-20" fill="none" stroke="#3f8b45" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="272" y="180" width="66" height="9" rx="4.5" fill="#d9c7a8"/>
    <path d="M232 226l10 10 18-20" fill="none" stroke="#3f8b45" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="272" y="222" width="44" height="9" rx="4.5" fill="#d9c7a8"/>
