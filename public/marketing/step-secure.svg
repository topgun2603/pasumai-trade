<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Illustration standing in for a photograph of a secured payment and its confirmation code">
  <rect width="400" height="300" fill="#eef4ea"/>

  <!-- The handset, held upright. Same flat treatment as the other stand-ins:
    one ground colour, two greens and the warm tone, no gradients. -->
  <rect x="138" y="40" width="124" height="220" rx="18" fill="#ffffff" stroke="#2f6b34" stroke-width="3"/>
  <rect x="182" y="52" width="36" height="6" rx="3" fill="#d9c7a8"/>

  <!-- The amount, held rather than paid. -->
  <rect x="158" y="78" width="84" height="12" rx="6" fill="#d9c7a8"/>

  <!-- The code itself: six characters, as issued. -->
  <g fill="#3f8b45">
    <rect x="158" y="106" width="12" height="26" rx="3"/>
    <rect x="174" y="106" width="12" height="26" rx="3"/>
    <rect x="190" y="106" width="12" height="26" rx="3"/>
    <rect x="206" y="106" width="12" height="26" rx="3"/>
    <rect x="222" y="106" width="12" height="26" rx="3"/>
    <rect x="238" y="106" width="4" height="26" rx="2"/>
  </g>

  <!-- The padlock, closed. The whole point of the step. -->
  <path d="M182 186v-12a18 18 0 0 1 36 0v12" fill="none" stroke="#2f6b34" stroke-width="7" stroke-linecap="round"/>
  <rect x="170" y="186" width="60" height="46" rx="9" fill="#2f6b34"/>
  <circle cx="200" cy="205" r="5.5" fill="#eef4ea"/>
  <rect x="197" y="206" width="6" height="13" rx="3" fill="#eef4ea"/>

  <!-- Two sprouts either side, so the frame reads as produce rather than
    banking. The same pair the settlement stand-in uses. -->
  <g fill="#3f8b45" opacity=".55">
    <path d="M92 250c0-22 6-42 22-56-22 4-34 22-36 42-4-16-16-28-34-31 12 15 16 31 16 45z"/>
    <path d="M308 250c0-22-6-42-22-56 22 4 34 22 36 42 4-16 16-28 34-31-12 15-16 31-16 45z"/>
  </g>
</svg>
