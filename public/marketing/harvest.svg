<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" role="img" aria-label="Illustration of graded produce stacked in crates at a collection point">
  <defs><clipPath id="hv"><rect width="560" height="400" rx="16"/></clipPath></defs>
  <g clip-path="url(#hv)">
    <rect width="560" height="400" fill="#eef2ea"/>
    <path d="M0 250h560v150H0z" fill="#dde5d9"/>
    <path d="M0 246h560v8H0z" fill="#cbd6c6"/>

    <!-- Back wall slats -->
    <g stroke="#dbe3d6" stroke-width="3">
      <path d="M60 0v246M180 0v246M300 0v246M420 0v246M540 0v246"/>
    </g>

    <!-- Grade A crate -->
    <g transform="translate(44 150)">
      <rect x="0" y="44" width="150" height="82" rx="8" fill="#b9822f"/>
      <rect x="0" y="44" width="150" height="12" rx="5" fill="#a4711f"/>
      <g stroke="#95661a" stroke-width="3"><path d="M0 78h150M0 100h150"/></g>
      <g fill="#c0562f">
        <circle cx="30" cy="34" r="20"/><circle cx="72" cy="26" r="23"/><circle cx="116" cy="34" r="19"/>
      </g>
      <g fill="#d8734a" opacity=".55">
        <circle cx="25" cy="27" r="6"/><circle cx="66" cy="17" r="7"/><circle cx="111" cy="28" r="5"/>
      </g>
      <rect x="46" y="88" width="58" height="22" rx="5" fill="#f4f6f1"/>
      <text x="75" y="104" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#1c5b3e">A</text>
    </g>

    <!-- Grade B crate -->
    <g transform="translate(216 186)">
      <rect x="0" y="40" width="140" height="72" rx="8" fill="#c99640"/>
      <rect x="0" y="40" width="140" height="11" rx="5" fill="#b1802e"/>
      <g stroke="#a2731f" stroke-width="3"><path d="M0 70h140M0 90h140"/></g>
      <g fill="#e8c05a">
        <circle cx="30" cy="30" r="18"/><circle cx="70" cy="24" r="20"/><circle cx="110" cy="31" r="17"/>
      </g>
      <rect x="42" y="80" width="56" height="21" rx="5" fill="#f4f6f1"/>
      <text x="70" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7a5410">B</text>
    </g>

    <!-- Sacks -->
    <g transform="translate(384 176)">
      <path d="M22 22c0-12 10-22 22-22h32c12 0 22 10 22 22v76a12 12 0 0 1-12 12H34a12 12 0 0 1-12-12z" fill="#d8cbaa"/>
      <path d="M40 0h40l-6 16H46z" fill="#c4b78f"/>
      <rect x="38" y="52" width="48" height="20" rx="4" fill="#f4f6f1"/>
      <path d="M96 40c0-10 8-18 18-18h20c10 0 18 8 18 18v58a10 10 0 0 1-10 10h-36a10 10 0 0 1-10-10z" fill="#cdbf9c"/>
    </g>

    <!-- Weighing scale -->
    <g transform="translate(60 292)">
      <rect x="0" y="40" width="120" height="16" rx="6" fill="#8fa09a"/>
      <rect x="14" y="16" width="92" height="26" rx="5" fill="#b6c3bd"/>
      <circle cx="60" cy="10" r="14" fill="#f4f6f1" stroke="#8fa09a" stroke-width="3"/>
      <path d="M60 10v-8" stroke="#1c5b3e" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Clipboard -->
    <g transform="translate(430 300)">
      <rect x="0" y="0" width="72" height="92" rx="7" fill="#f7f9f6" stroke="#cbd6c6" stroke-width="2"/>
      <rect x="24" y="-6" width="24" height="12" rx="4" fill="#1c5b3e"/>
      <g stroke="#c3cec0" stroke-width="4" stroke-linecap="round">
        <path d="M14 26h44M14 42h44M14 58h30"/>
      </g>
      <path d="M46 62l8 8 16-18" stroke="#1c5b3e" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
