name: CI

# Quality gates first, deploy only if they pass.
#
# Vercel's own Git integration would deploy on every push regardless of whether
# the tests passed. This platform moves money — the order guards fail closed and
# the bargaining rules decide what a farmer is paid — so a red build must not be
# able to reach production. Hence the deploy runs here, gated on `quality`, and
# the Git integration is left switched off (see vercel.json).

on:
  push:
    branches: [main]
  pull_request:
  # So a deploy can be re-run without an empty commit.
  workflow_dispatch:

# A newer push makes an in-flight run pointless. Production is excluded from
# cancellation: interrupting a deploy mid-flight is how you get a half-promoted
# alias.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Silences the CLI's first-run banner and keeps logs readable.
  VERCEL_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # `RouteContext<'/path'>` and friends are generated by Next into
      # .next/types, which does not exist on a clean checkout — so a type check
      # run before this fails with "Cannot find name 'RouteContext'". `typegen`
      # produces them without paying for a full build.
      - name: Generate route types
        run: npx next typegen

      # Separate from the build because `next build` does not fail on a type
      # error in a file it does not happen to bundle.
      - name: Type check
        run: npx tsc --noEmit

      # `functions` is its own npm package with its own dependencies, its own
      # tsconfig and a CommonJS target, so the root check above deliberately
      # excludes it. Without these two steps it would be type-checked nowhere:
      # the root check used to sweep it in and pass only on machines that
      # happened to have these dependencies installed.
      - name: Install functions
        run: npm ci --prefix functions

      - name: Type check functions
        run: npm run typecheck --prefix functions

      - name: Test
        run: npm test

      # Turbopack's cache survives between runs and cuts a cold build roughly
      # in half. Keyed on the lockfile and source so a stale cache is never
      # reused across a dependency change.
      - name: Restore build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # A compile check, not the artifact that ships. NEXT_PUBLIC_* values are
      # inlined at build time, so the bundle that actually serves traffic has to
      # be built by Vercel with the project's environment variables — this one
      # deliberately has none, which also proves the app still compiles when
      # Firebase is not configured.
      - name: Build
        run: npm run build

  preview:
    name: Deploy preview
    needs: quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}

    # The CLI reads all three from the environment, so no --token flag is
    # needed. Passing it as a flag turns an unset secret into "you defined
    # --token, but it's missing a value", which says nothing about the actual
    # problem.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check Vercel credentials
        run: .github/scripts/check-vercel-secrets.sh

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull environment
        run: vercel pull --yes --environment=preview

      - name: Build
        run: vercel build

      - name: Deploy
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Deploy production
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check Vercel credentials
        run: .github/scripts/check-vercel-secrets.sh

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull environment
        run: vercel pull --yes --environment=production

      - name: Build
        run: vercel build --prod

      - name: Deploy
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production: $url" >> "$GITHUB_STEP_SUMMARY"

      # The deployed bundle is the one that matters, so check the real thing
      # rather than trusting that a green build implies a working site.
      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
          # Deployment Protection answers a bare curl with its own sign-in
          # redirect, so without this the smoke test never reaches the site.
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: .github/scripts/smoke-test.sh
